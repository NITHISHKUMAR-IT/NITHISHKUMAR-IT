<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Nithishkumar K — Aspiring Cloud and DevOps Engineer</title>
  <desc id="desc">Dark cloud engineering banner with AWS-orange and cloud-blue accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.52" stop-color="#0b2447"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#ff9900" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#38bdf8" stroke-opacity="0.075"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1050" cy="48" r="165" fill="#ff9900" opacity="0.06"/>
  <circle cx="120" cy="292" r="210" fill="#38bdf8" opacity="0.055"/>

  <g transform="translate(80 82)" filter="url(#glow)">
    <path d="M28 82h134c25 0 45-18 45-41 0-22-18-40-41-41-9-27-35-46-66-46-34 0-62 23-68 54C13 12 0 27 0 45c0 20 12 37 28 37Z" fill="none" stroke="#38bdf8" stroke-width="5"/>
    <path d="M74 34h61M74 52h61M74 70h40" stroke="#ff9900" stroke-width="5" stroke-linecap="round"/>
    <circle cx="54" cy="34" r="4" fill="#22c55e"/>
    <circle cx="54" cy="52" r="4" fill="#22c55e"/>
    <circle cx="54" cy="70" r="4" fill="#22c55e"/>
  </g>

  <g transform="translate(330 72)">
    <text x="0" y="48" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="2">NITHISHKUMAR K</text>
    <text x="2" y="94" fill="#ff9900" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4">ASPIRING CLOUD &amp; DEVOPS ENGINEER</text>
    <rect x="2" y="120" width="720" height="3" rx="2" fill="url(#line)"/>
    <text x="2" y="157" fill="#bae6fd" font-family="Consolas, Menlo, monospace" font-size="19">AWS  •  LINUX  •  DOCKER  •  CLOUDFORMATION</text>
    <text x="2" y="195" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17">Build  →  Secure  →  Deploy  →  Monitor  →  Improve</text>
  </g>

  <g transform="translate(1028 214)" opacity="0.95">
    <rect x="0" y="0" width="88" height="23" rx="5" fill="#0f172a" stroke="#38bdf8"/>
    <rect x="0" y="34" width="88" height="23" rx="5" fill="#0f172a" stroke="#38bdf8"/>
    <rect x="0" y="68" width="88" height="23" rx="5" fill="#0f172a" stroke="#ff9900"/>
    <circle cx="14" cy="12" r="3" fill="#22c55e"/><circle cx="25" cy="12" r="3" fill="#38bdf8"/>
    <circle cx="14" cy="46" r="3" fill="#22c55e"/><circle cx="25" cy="46" r="3" fill="#38bdf8"/>
    <circle cx="14" cy="80" r="3" fill="#22c55e"/><circle cx="25" cy="80" r="3" fill="#ff9900"/>
  </g>

  <rect x="0" y="312" width="1200" height="8" rx="4" fill="url(#line)"/>
</svg>

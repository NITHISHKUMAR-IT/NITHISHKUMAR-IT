  <rect width="1200" height="600" rx="26" fill="url(#bg)"/>
  <text x="54" y="58" fill="#fff" font-family="Segoe UI,Arial" font-size="31" font-weight="800">CLOUD &amp; DEVOPS TOOLBOX</text>

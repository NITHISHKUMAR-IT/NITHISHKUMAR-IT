<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title">
  <title id="title">Nithishkumar's featured cloud projects</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#082f49"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-opacity=".35"/></filter></defs>
  <rect width="1200" height="500" rx="26" fill="url(#bg)"/>
  <text x="50" y="58" fill="#fff" font-family="Segoe UI,Arial" font-size="31" font-weight="800">FEATURED ENGINEERING WORK</text>
  <text x="50" y="88" fill="#ff9900" font-family="Consolas,monospace" font-size="15" letter-spacing="2">REAL DEPLOYMENTS • DOCUMENTED EVIDENCE • CONTINUOUS IMPROVEMENT</text>
  <g font-family="Segoe UI,Arial" filter="url(#s)">
    <g transform="translate(50 125)"><rect width="535" height="145" rx="18" fill="#111827" stroke="#ff9900" stroke-width="2"/><text x="25" y="37" fill="#ff9900" font-size="14" font-weight="800">IN PROGRESS • AWS ARCHITECTURE</text><text x="25" y="72" fill="#fff" font-size="22" font-weight="800">Highly Available 3-Tier Web App</text><text x="25" y="102" fill="#94a3b8" font-size="14">VPC • ALB • Auto Scaling • EC2 • RDS • CloudWatch</text><text x="25" y="127" fill="#7dd3fc" font-size="13">Multi-AZ, private tiers and security-group chaining</text></g>
    <g transform="translate(615 125)"><rect width="535" height="145" rx="18" fill="#111827" stroke="#759c3e" stroke-width="2"/><text x="25" y="37" fill="#86efac" font-size="14" font-weight="800">COMPLETED • INFRASTRUCTURE AS CODE</text><text x="25" y="72" fill="#fff" font-size="22" font-weight="800">AWS CloudFormation Deployment</text><text x="25" y="102" fill="#94a3b8" font-size="14">YAML • VPC • Subnet • IAM Role • EC2 • Nginx</text><text x="25" y="127" fill="#7dd3fc" font-size="13">Reusable template with automated provisioning</text></g>
    <g transform="translate(50 295)"><rect width="345" height="145" rx="18" fill="#111827" stroke="#38bdf8"/><text x="22" y="35" fill="#7dd3fc" font-size="13" font-weight="800">COMPLETED</text><text x="22" y="69" fill="#fff" font-size="20" font-weight="800">EC2 + Nginx</text><text x="22" y="98" fill="#94a3b8" font-size="13">Linux deployment, security</text><text x="22" y="120" fill="#94a3b8" font-size="13">groups and HTTP validation</text></g>
    <g transform="translate(428 295)"><rect width="345" height="145" rx="18" fill="#111827" stroke="#2496ed"/><text x="22" y="35" fill="#60a5fa" font-size="13" font-weight="800">COMPLETED</text><text x="22" y="69" fill="#fff" font-size="20" font-weight="800">Dockerized Nginx App</text><text x="22" y="98" fill="#94a3b8" font-size="13">Image build, port mapping,</text><text x="22" y="120" fill="#94a3b8" font-size="13">health checks and verification</text></g>
    <g transform="translate(805 295)"><rect width="345" height="145" rx="18" fill="#111827" stroke="#f97316"/><text x="22" y="35" fill="#fb923c" font-size="13" font-weight="800">COMPLETED</text><text x="22" y="69" fill="#fff" font-size="20" font-weight="800">Java Server Health Checker</text><text x="22" y="98" fill="#94a3b8" font-size="13">JSP, Servlet, Tomcat and</text><text x="22" y="120" fill="#94a3b8" font-size="13">MySQL CRUD workflow</text></g>
